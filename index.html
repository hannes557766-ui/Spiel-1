<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>BLOCK DODGE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;800&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #fbfbfc; color: #111; font-family: 'Space Grotesk', system-ui, sans-serif; user-select: none; touch-action: none; }
  canvas { position: fixed; inset: 0; display: block; }
  .playing-cursor { cursor: none; }
  .hud { position: fixed; inset: 0 0 auto 0; z-index: 20; pointer-events: none; padding: 24px 28px; display: flex; justify-content: space-between; align-items: flex-start; }
  .label { color: #9a9aa3; font-size: 11px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; }
  .score { font-family: 'JetBrains Mono', monospace; font-size: clamp(42px, 8vw, 78px); font-weight: 800; line-height: .86; letter-spacing: -3px; }
  .right { text-align: right; display: grid; gap: 14px; }
  .value { font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 800; }
  .hint { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); z-index: 25; pointer-events: none; color: #9a9aa3; font-size: 13px; font-weight: 800; text-align: center; animation: pulse 1.5s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: .35; transform: translateX(-50%) translateY(0); } 50% { opacity: 1; transform: translateX(-50%) translateY(-3px); } }
  .toast { position: fixed; left: 50%; top: 44%; transform: translate(-50%,-50%); z-index: 30; opacity: 0; pointer-events: none; font-size: clamp(30px, 8vw, 70px); font-weight: 800; letter-spacing: -4px; }
  .toast.show { animation: pop .7s cubic-bezier(.16,1,.3,1) forwards; }
  @keyframes pop { 0% { opacity: 0; transform: translate(-50%,-35%) scale(.85); } 18% { opacity: 1; transform: translate(-50%,-50%) scale(1.05); } 100% { opacity: 0; transform: translate(-50%,-82%) scale(1); } }
  .modal { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(255,255,255,.55); backdrop-filter: blur(12px); z-index: 60; padding: 20px; }
  .modal.show { display: flex; }

  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 26px 0 18px; }
  .stat { background: #f8f8fa; border: 1px solid #eeeef2; border-radius: 18px; padding: 16px 10px; }
  .stat strong { display: block; font-family: 'JetBrains Mono', monospace; font-size: 30px; line-height: 1; }
  .stat span { display: block; margin-top: 7px; color: #9a9aa3; font-size: 11px; font-weight: 800; letter-spacing: 1.4px; text-transform: uppercase; }
  .btn { width: 100%; border: 0; border-radius: 15px; padding: 16px 20px; font: 800 15px 'Space Grotesk', sans-serif; cursor: pointer; transition: .18s ease; }
  .btn-primary { background: #111; color: #fff; }
  .btn-primary:hover { background: #252529; transform: translateY(-2px); box-shadow: 0 14px 32px rgba(0,0,0,.18); }
  .btn-ghost { background: #f2f2f5; color: #111; margin-top: 10px; }
  .btn-ghost:hover { background: #e7e7ec; }
  .sound { position: fixed; right: 22px; bottom: 22px; z-index: 70; width: 50px; height: 50px; border-radius: 999px; border: 1px solid #e4e4e7; background: #fff; cursor: pointer; font-size: 12px; font-weight: 800; box-shadow: 0 8px 24px rgba(0,0,0,.07); }
  .sound:hover { background: #fafafa; transform: scale(1.04); }

  .panel { width: min(380px, 100%); background: #fff; border-radius: 28px; padding: 36px 28px; text-align: center; box-shadow: 0 30px 90px rgba(0,0,0,.12), 0 0 0 1px rgba(0,0,0,.04); }
  .panel h1 { font-size: clamp(34px, 8vw, 48px); font-weight: 800; letter-spacing: -2px; line-height: 1; margin: 0; }
  .panel h2 { font-size: 28px; font-weight: 800; letter-spacing: -1px; margin-bottom: 0; }
  .diff-bar { display: flex; background: #f0f0f4; border-radius: 16px; padding: 4px; margin: 26px 0 22px; gap: 3px; }
  .diff-pill { flex: 1; border: none; background: transparent; border-radius: 12px; padding: 9px 0; font-family: 'Space Grotesk', sans-serif; font-size: 12px; font-weight: 700; color: #888892; cursor: pointer; transition: all .18s ease; }
  .diff-pill:hover { color: #111; }
  .diff-pill.active { background: #fff; color: #111; box-shadow: 0 3px 10px rgba(0,0,0,.07); }
  .coin-hud { display: inline-flex; align-items: center; gap: 6px; background: #111; color: #fff; border-radius: 999px; padding: 8px 14px; font-weight: 800; font-size: 14px; margin: 0 auto 4px; }
  .coin-hud .dot { width: 13px; height: 13px; border-radius: 50%; background: #ffcf33; box-shadow: inset 0 0 0 2px rgba(0,0,0,.15); }
  .shop-hd { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 16px; }
  .shop-tabs { display: flex; background: #f0f0f4; border-radius: 14px; padding: 3px; gap: 3px; margin-bottom: 16px; }
  .shop-tab { flex: 1; border: none; background: transparent; border-radius: 11px; padding: 9px 0; font-family: 'Space Grotesk', sans-serif; font-size: 11px; font-weight: 800; letter-spacing: .3px; color: #888892; cursor: pointer; transition: .16s ease; }
  .shop-tab.active { background: #fff; color: #111; box-shadow: 0 3px 10px rgba(0,0,0,.07); }
  .shop-list { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; max-height: 46vh; overflow-y: auto; padding: 2px; margin-bottom: 16px; }
  .shop-item { border: 2px solid #eeeef2; border-radius: 16px; padding: 12px 10px; text-align: center; cursor: pointer; transition: .16s ease; background: #fafafa; }
  .shop-item:hover { border-color: #c9c9d1; transform: translateY(-2px); }
  .shop-item.equipped { border-color: #111; background: #fff; }
  .shop-item .preview { width: 40px; height: 40px; margin: 2px auto 8px; border-radius: 10px; }
  .shop-item .name { font-size: 12px; font-weight: 800; letter-spacing: .3px; }
  .shop-item .cost { margin-top: 6px; font-size: 11px; font-weight: 800; color: #888892; display: inline-flex; align-items: center; gap: 4px; }
  .shop-item .cost .c { width: 10px; height: 10px; border-radius: 50%; background: #ffcf33; }
  .shop-item .status { margin-top: 6px; font-size: 11px; font-weight: 800; }
  .shop-item .status.owned { color: #23a45a; }
  .shop-item .status.eq { color: #111; }
  .shop-list::-webkit-scrollbar { width: 6px; }
  .shop-list::-webkit-scrollbar-thumb { background: #dcdce2; border-radius: 3px; }
  .btn-shop { background: #f2f2f5; color: #111; margin-top: 10px; }
  .btn-shop:hover { background: #e7e7ec; }
  .name-input { width: 100%; padding: 14px 16px; border: 2px solid #e8e8ec; border-radius: 14px; font: 700 15px 'Space Grotesk', sans-serif; color: #111; background: #fafafa; outline: none; margin-bottom: 12px; text-align: center; }
  .name-input:focus { border-color: #111; background: #fff; }
  .nm-sub { color: #9a9aa3; font-size: 12px; font-weight: 700; margin-bottom: 16px; }
  .lb-list { max-height: 48vh; overflow-y: auto; padding: 2px; margin: 14px 0; }
  .lb-row { display: flex; align-items: center; gap: 10px; padding: 11px 12px; border-radius: 12px; background: #fafafa; border: 1px solid #eeeef2; margin-bottom: 8px; }
  .lb-row.me { border-color: #111; background: #fff; }
  .lb-rank { width: 32px; text-align: center; font-family: 'JetBrains Mono', monospace; font-weight: 800; font-size: 14px; color: #9a9aa3; }
  .lb-name { flex: 1; font-size: 13px; font-weight: 800; letter-spacing: .2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lb-score { font-family: 'JetBrains Mono', monospace; font-weight: 800; font-size: 14px; }
  .lb-tab { flex: 1; border: none; background: transparent; border-radius: 11px; padding: 9px 0; font-family: 'Space Grotesk', sans-serif; font-size: 11px; font-weight: 800; color: #888892; cursor: pointer; transition: .16s ease; }
  .lb-tab.active { background: #fff; color: #111; box-shadow: 0 3px 10px rgba(0,0,0,.07); }
  .lb-empty { padding: 16px; text-align: center; color: #9a9aa3; font-size: 12px; font-weight: 700; }
  .lb-rename { border: none; background: none; color: #9a9aa3; font: 700 11px 'Space Grotesk', sans-serif; cursor: pointer; text-decoration: underline; }
  .lb-rename:hover { color: #111; }
  .lb-kick { border: none; background: #fde8e8; color: #dc2626; width: 26px; height: 26px; border-radius: 8px; font-weight: 800; font-size: 12px; cursor: pointer; flex-shrink: 0; transition: .15s ease; }
  .lb-kick:hover { background: #dc2626; color: #fff; transform: scale(1.1); }
  .lvldots { display: flex; justify-content: center; gap: 4px; margin: 6px 0; }
  .lvldots .dot { width: 7px; height: 7px; border-radius: 50%; background: #dddde3; transition: .16s; }
  .lvldots .dot.on { background: #111; }
  .upgrade-cost { font-size: 10px; color: #888892; font-weight: 800; margin-top: 4px; display: inline-flex; align-items: center; gap: 3px; }
  .upgrade-cost .uc { width: 8px; height: 8px; border-radius: 50%; background: #ffcf33; }
  .shop-item .plabel { font-size: 10px; color: #23a45a; font-weight: 800; }
  .btn-google { background: #fff; color: #111; border: 2px solid #e8e8ec; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .btn-google:hover { background: #f5f5f5; box-shadow: 0 6px 18px rgba(0,0,0,.08); }
  .g-logo { width: 18px; height: 18px; }
  .avatar { width: 58px; height: 58px; border-radius: 50%; background: #111; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 800; margin: 6px auto 10px; }
  .login-info-name { font-size: 18px; font-weight: 800; }
  .login-info-mail { font-size: 12px; color: #9a9aa3; font-weight: 700; margin-top: 2px; }
  .or-div { display: flex; align-items: center; gap: 10px; margin: 14px 0 2px; }
  .or-div .line { flex: 1; height: 1px; background: #eee; }
  .or-div span { font-size: 11px; color: #9a9aa3; font-weight: 700; letter-spacing: 1px; }
  .auth-msg { color: #ef4444; font-size: 12px; font-weight: 700; min-height: 16px; margin: 8px 0 4px; }
  .dev-panel { position: fixed; left: 22px; bottom: 22px; z-index: 55; display: none; width: 210px; padding: 14px; border-radius: 16px; background: rgba(17,17,17,.94); color: #fff; box-shadow: 0 12px 30px rgba(0,0,0,.18); pointer-events: auto; }
  .dev-title { color: #ffd94a; font-size: 10px; font-weight: 800; letter-spacing: 2px; margin-bottom: 10px; }
  .dev-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 12px; font-weight: 800; }
  .dev-row output { color: #ffd94a; font-family: 'JetBrains Mono', monospace; }
  .dev-range { display: block; width: 100%; margin: 8px 0 12px; accent-color: #ffd94a; cursor: pointer; }
  .dev-god { width: 100%; border: 1px solid #555; border-radius: 9px; padding: 8px; background: #252525; color: #fff; font: 800 11px 'Space Grotesk', sans-serif; cursor: pointer; }
  .dev-god.on { background: #ffd94a; color: #111; border-color: #ffd94a; }
  @media (max-width: 700px) { .dev-panel { left: 12px; bottom: 12px; width: 190px; } }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div class="hud">
  <div><div class="label">Score</div><div class="score" id="score">0</div></div>
  <div class="right"><div><div class="label">Coins</div><div class="value" id="coinsHud">∞</div></div><div><div class="label">Speed</div><div class="value" id="speed">1.0x</div></div><div><div class="label">Modus</div><div class="value" id="mode" style="font-size:14px;text-transform:uppercase;letter-spacing:1px;">Normal</div></div></div>
</div>
<div class="hint" id="hint">Maus oder Finger bewegen · A / D · Pfeile</div>
<div class="toast" id="toast">FAST</div>
<div id="devPanel" class="dev-panel">
  <div class="dev-title">DEV TOOLS</div>
  <div class="dev-row"><span>Speed</span><output id="devSpeedValue">1.0x</output></div>
  <input id="devSpeed" class="dev-range" type="range" min="0.25" max="3" step="0.05" value="1" />
  <button id="devGod" class="dev-god">GOD MODE: AUS</button>
</div>
<button class="sound" id="soundBtn">ON</button>
<div id="menu" class="modal show">
  <div class="panel">
    <h1>BLOCK DODGE</h1>
    <div class="coin-hud"><span class="dot"></span><span id="menuCoins">∞</span></div>
    <div class="diff-bar">
      <button class="diff-pill" data-diff="easy">Easy</button>
      <button class="diff-pill active" data-diff="normal">Normal</button>
      <button class="diff-pill" data-diff="hard">Hard</button>
      <button class="diff-pill" data-diff="extreme">Extreme</button>
    </div>
    <button class="btn btn-primary" id="startBtn">START</button>
    <button class="btn btn-shop" id="shopBtn">SHOP</button>
    <button class="btn btn-ghost" id="lbBtn">RANGLISTE</button>
    <button class="btn btn-ghost" id="accountBtn">ANMELDEN</button>
  </div>
</div>
<div id="loginModal" class="modal">
  <div class="panel" style="width:min(400px,100%);text-align:center;">
    <h2 id="loginTitle">ANMELDEN</h2>
    <div class="nm-sub" id="loginSub"></div>
    <div id="loginForm">
      <input id="loginEmail" class="name-input" type="email" placeholder="E-Mail" autocomplete="email" />
      <input id="loginPass" class="name-input" type="password" placeholder="Passwort (min. 6 Zeichen)" autocomplete="current-password" />
      <input id="loginName" class="name-input" type="text" maxlength="14" placeholder="Spielername" autocomplete="nickname" style="display:none;" />
      <div class="auth-msg" id="loginMsg"></div>
      <button class="btn btn-primary" id="loginSubmit">ANMELDEN</button>
      <button class="btn btn-ghost" id="loginToggle">Konto erstellen</button>
      <div class="or-div"><div class="line"></div><span>ODER</span><div class="line"></div></div>
      <button class="btn btn-google" id="googleBtn">
        <svg class="g-logo" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3l5.7-5.7C34.3 6.1 29.4 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3l5.7-5.7C34.3 6.1 29.4 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.1 5.7l6.2 5.2C36.9 39.2 44 34 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg>
        Mit Google anmelden
      </button>
      <button class="btn btn-ghost" id="anonBtn" style="margin-top:10px;">Als Gast spielen</button>
    </div>
    <div id="loginInfo" style="display:none;">
      <div class="avatar" id="loginAvatar">?</div>
      <div class="login-info-name" id="loginDisplayName">—</div>
      <div class="login-info-mail" id="loginEmail2">—</div>
      <button class="btn btn-primary" id="logoutBtn" style="margin-top:18px;">ABMELDEN</button>
      <button class="btn btn-ghost" id="renameBtn">Name ändern</button>
      <button class="btn btn-ghost" id="devBtn" style="display:none;margin-top:10px;border-color:#111;background:#111;color:#ffd94a;">⚡ DEVELOPER MODE: AUS</button>
    </div>
    <button class="btn btn-ghost" id="loginBack">ZURÜCK</button>
  </div>
</div>
<div id="nameModal" class="modal">
  <div class="panel">
    <h2>DEIN NAME</h2>
    <input id="nameInput" class="name-input" maxlength="14" placeholder="Name…" autocomplete="off" style="margin-top:16px;" />
    <button class="btn btn-primary" id="nameSave">SPEICHERN</button>
  </div>
</div>
<div id="lbModal" class="modal">
  <div class="panel" style="width:min(440px,100%);text-align:left;">
    <div class="shop-hd"><h2 style="margin:0;">RANGLISTE</h2><span id="lbStatus" style="font-size:11px;color:#9a9aa3;font-weight:800;">…</span></div>
    <div class="shop-tabs">
      <button class="lb-tab" data-lbdiff="easy">Easy</button>
      <button class="lb-tab active" data-lbdiff="normal">Normal</button>
      <button class="lb-tab" data-lbdiff="hard">Hard</button>
      <button class="lb-tab" data-lbdiff="extreme">Extreme</button>
    </div>
    <div class="lb-list" id="lbList"><div class="lb-empty">Lade Rangliste…</div></div>
    <div style="text-align:center;margin-bottom:12px;"><button class="lb-rename" id="lbRename">Name ändern</button></div>
    <button class="btn btn-primary" id="lbBack">ZURÜCK</button>
  </div>
</div>
<div id="shop" class="modal">
  <div class="panel" style="width:min(440px,100%);text-align:left;">
    <div class="shop-hd">
      <h2 style="margin:0;">SHOP</h2>
      <div class="coin-hud"><span class="dot"></span><span id="shopCoins">∞</span></div>
    </div>
    <div class="shop-tabs">
      <button class="shop-tab active" data-tab="player">Spieler</button>
      <button class="shop-tab" data-tab="blocks">Blöcke</button>
      <button class="shop-tab" data-tab="bg">Hinter</button>
      <button class="shop-tab" data-tab="music">Musik</button>
      <button class="shop-tab" data-tab="powers">Skills</button>
    </div>
    <div class="shop-list" id="shopList"></div>
    <button class="btn btn-primary" id="shopBack">ZURÜCK</button>
  </div>
</div>
<div id="over" class="modal">
  <div class="panel">
    <h2>GAME OVER</h2>
    <div id="newRecordBadge" style="display:none;margin:8px auto 0;background:#111;color:#fff;border-radius:999px;padding:4px 14px;font-size:11px;font-weight:800;letter-spacing:1.5px;width:fit-content;">★ NEUER REKORD ★</div>
    <div class="stats" style="grid-template-columns:1fr 1fr 1fr;margin-top:18px;"><div class="stat"><strong id="finalScore">0</strong><span>Score</span></div><div class="stat"><strong id="finalBest">0</strong><span>Rekord</span></div><div class="stat"><strong id="finalCoins">+0</strong><span>Coins</span></div></div>
    <button class="btn btn-primary" id="againBtn">NOCHMAL</button><button class="btn btn-shop" id="overShopBtn">SHOP</button><button class="btn btn-ghost" id="overLbBtn">RANGLISTE</button><button class="btn btn-ghost" id="homeBtn">MENÜ</button>
  </div>
</div>
<script>
'use strict';
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const DPR = Math.min(window.devicePixelRatio || 1, 2);
let W = 0, H = 0;
function resize() { W = innerWidth; H = innerHeight; canvas.width = W * DPR; canvas.height = H * DPR; canvas.style.width = W + 'px'; canvas.style.height = H + 'px'; ctx.setTransform(DPR, 0, 0, DPR, 0, 0); buildLanes(); }
addEventListener('resize', resize);
const STATE = { MENU: 0, PLAY: 1, OVER: 2 };
const DIFFS = {
  easy:    { speed: 0.72, spawn: 0.35, size: -14, vx: 0.6,  score: 1.0 },
  normal:  { speed: 1.0,  spawn: 0.0,  size: 0,   vx: 1.0,  score: 1.5 },
  hard:    { speed: 1.3,  spawn: -0.14, size: 14, vx: 1.5,  score: 2.5 },
  extreme: { speed: 1.62, spawn: -0.28, size: 30, vx: 2.0,  score: 4.0 }
};
const DIFF_LABELS = { easy: 'Easy', normal: 'Normal', hard: 'Hard', extreme: 'Extreme' };

// ---- SHOP ITEMS ----
const SKINS = [
  { id: 'classic',  name: 'Classic',  cost: 0,    color: '#111',    eye: '#fff' },
  { id: 'ghost',    name: 'Ghost',    cost: 200,  color: '#e6e6ee', eye: '#111', outline: '#111' },
  { id: 'ocean',    name: 'Ocean',    cost: 400,  color: '#2b8fff', eye: '#fff' },
  { id: 'lime',     name: 'Lime',     cost: 400,  color: '#37d67a', eye: '#0a3d1f' },
  { id: 'sunset',   name: 'Sunset',   cost: 600,  color: '#ff7a3d', eye: '#fff' },
  { id: 'candy',    name: 'Candy',    cost: 600,  color: '#ff5aa5', eye: '#fff' },
  { id: 'gold',     name: 'Gold',     cost: 1200, color: '#ffcf33', eye: '#5a4300' },
  { id: 'violet',   name: 'Violet',   cost: 900,  color: '#8b5cf6', eye: '#fff' },
  { id: 'toxic',    name: 'Toxic',    cost: 700,  color: '#a3e635', eye: '#1a2e05' },
  { id: 'ice',      name: 'Ice',      cost: 700,  color: '#7dd3fc', eye: '#0c4a6e' },
  { id: 'berry',    name: 'Berry',    cost: 900,  color: '#e11d48', eye: '#fff' },
  { id: 'midnight', name: 'Midnight', cost: 1100, color: '#111827', eye: '#fff', outline: '#6b7280' },
  { id: 'rainbow',  name: 'Rainbow',  cost: 2500, color: 'rainbow', eye: '#fff' }
];

  ctx.scale(1 + (1 - player.squash) * .45, player.squash);
  ctx.fillStyle = 'rgba(0,0,0,.1)';
  roundRect(-player.w / 2 + 1, -player.h / 2 + 3, player.w, player.h, 9);
  ctx.fill();
  ctx.fillStyle = skinFill(sk, 0, 0, player.w / 2);
  roundRect(-player.w / 2, -player.h / 2, player.w, player.h, 9);
  ctx.fill();
  const isDarkBG = currentBG().dark;
  const strokeCol = sk.outline || (isDarkBG && sk.color === '#111' ? '#ffffff' : (!isDarkBG && sk.color === '#e6e6ee' ? '#111111' : null));
  if (strokeCol) {
    ctx.strokeStyle = strokeCol;
    ctx.lineWidth = 2.5;
    roundRect(-player.w / 2, -player.h / 2, player.w, player.h, 9);
    ctx.stroke();
  }
  ctx.fillStyle = sk.eye || '#fff';
  const o = player.w / 42;
  ctx.fillRect(-11 * o, -7 * o, 7 * o, 7 * o);
  ctx.fillRect(4 * o, -7 * o, 7 * o, 7 * o);
  ctx.restore();
}
function drawParticles() { for (const p of particles) { ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1; } }
function roundRect(x, y, w, h, r) { r = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function burst(x, y, color, n) { for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, sp = 90 + Math.random() * 260; particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 80, size: 2 + Math.random() * 4, color, life: .45 + Math.random() * .35, max: .8 }); } }

let lbRef = null;

function loadLB(diff) {
  lbDiff = diff;
  const list = document.getElementById('lbList');
  list.innerHTML = '<div class="lb-empty">Lade Rangliste…</div>';
  document.getElementById('lbStatus').textContent = '…';
  if (lbRef) { lbRef.off(); lbRef = null; }
  if (!db) {
    list.innerHTML = '<div class="lb-empty">Keine Verbindung zu Firebase.</div>';
    document.getElementById('lbStatus').textContent = 'Offline';
    return;
  }
  lbRef = db.ref('leaderboard/' + diff);
  lbRef.orderByChild('score').limitToLast(50).on('value', snap => {
    const data = snap.val() || {};
    const rawEntries = Object.entries(data).map(([key, en]) => Object.assign({ key: key }, en));
    // Keep only the highest score for each player name. New records are also
    // stored under the Firebase UID, so one account cannot create duplicates.
    const uniquePlayers = new Map();
    rawEntries.forEach(en => {
      const identity = String(en.name || en.key).trim().toLocaleLowerCase('de-DE');
      const previous = uniquePlayers.get(identity);
      if (!previous || (en.score || 0) > (previous.score || 0)) uniquePlayers.set(identity, en);
    });
    const entries = Array.from(uniquePlayers.values())
      .sort((a, b) => (b.score || 0) - (a.score || 0)).slice(0, 10);
    document.getElementById('lbStatus').textContent = entries.length + ' Einträge';
    if (!entries.length) {
      list.innerHTML = '<div class="lb-empty">Noch keine Einträge – spiel los!</div>';
      return;
    }
    const me = currentPlayerName();
    const medals = ['🥇', '🥈', '🥉'];
    const dev = devModeOn() && isDevUser();
    list.innerHTML = '';
    entries.forEach((en, i) => {
      const row = document.createElement('div');
      row.className = 'lb-row' + (en.name === me ? ' me' : '');
      const rank = i < 3 ? medals[i] : (i + 1);
      const kick = dev ? '<button class="lb-kick" data-key="' + escapeHtml(en.key) + '" title="Spieler kicken">✕</button>' : '';
      row.innerHTML = '<div class="lb-rank">' + rank + '</div>' +
        '<div class="lb-name">' + escapeHtml(en.name) + (en.name === me ? ' <span style="color:#23a45a;">(du)</span>' : '') + '</div>' +
        '<div class="lb-score">' + Math.floor(en.score || 0).toLocaleString('de-DE') + '</div>' + kick;
      list.appendChild(row);
    });
    if (dev) {
      list.querySelectorAll('.lb-kick').forEach(b => b.addEventListener('click', e => {
        e.stopPropagation();
        if (confirm('Diesen Spieler aus der Rangliste kicken?')) kickPlayer(lbDiff, b.dataset.key);
      }));
    }
  }, err => {
    document.getElementById('lbStatus').textContent = 'Offline';
    list.innerHTML = '<div class="lb-empty">Rangliste nicht erreichbar.<br>Prüfe die Firebase-Regeln.</div>';
  });
}

    const name = document.getElementById('loginName').value.trim().slice(0, 14);
    if (!name) { setLoginMsg('Bitte Spielername eingeben.'); return; }
    auth.createUserWithEmailAndPassword(email, pass)
      .then(cred => cred.user.updateProfile({ displayName: name }).then(() => {
        setPlayerName(name);
        closeLoginModal();
        syncPlayerRecords();
        saveUserDataToFirebase();
        toast('Willkommen, ' + name + '!');
        play('level');
      }))
      .catch(err => setLoginMsg(friendlyAuthError(err)));
  } else {
    auth.signInWithEmailAndPassword(email, pass)
      .then(() => { closeLoginModal(); syncPlayerRecords(); saveUserDataToFirebase(); toast('Eingeloggt!'); play('level'); })
      .catch(err => setLoginMsg(friendlyAuthError(err)));
  }
}
function loginGoogle() {
  if (!auth) { setLoginMsg('Firebase Auth nicht verfügbar.'); return; }
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider)
    .then(() => { closeLoginModal(); syncPlayerRecords(); saveUserDataToFirebase(); toast('Eingeloggt!'); play('level'); })
    .catch(err => setLoginMsg(friendlyAuthError(err)));
}
function loginAnon() {
  if (!auth) {
    closeLoginModal();
    if (!getPlayerName()) showNameModal();
    return;
  }
  auth.signInAnonymously()
    .then(() => {
      closeLoginModal();
      if (!getPlayerName()) {
        showNameModal();
      } else {
        syncPlayerRecords();
        toast('Als Gast angemeldet');
        play('level');
      }
    })
    .catch(err => {
      setLoginMsg(friendlyAuthError(err));
      setTimeout(() => {
        closeLoginModal();
        if (!getPlayerName()) showNameModal();
      }, 1000);
    });
}
function logout() {
  if (!auth) return;
  auth.signOut()
    .then(() => {
      closeLoginModal();
      setPlayerName('');
      document.getElementById('menu').classList.add('show');
      toast('Abgemeldet');
      play('click');
    })
    .catch(() => {});
}
function friendlyAuthError(err) {
  const c = (err && err.code) || '';
  if (c.includes('user-not-found')) return 'Kein Konto mit dieser E-Mail.';
  if (c.includes('wrong-password') || c.includes('invalid-credential')) return 'Falsches Passwort.';
  if (c.includes('email-already-in-use')) return 'E-Mail ist bereits vergeben.';
  if (c.includes('weak-password')) return 'Passwort zu schwach (min. 6 Zeichen).';
  if (c.includes('invalid-email')) return 'Ungültige E-Mail.';
  if (c.includes('popup-closed')) return 'Google-Fenster geschlossen.';
  if (c.includes('unauthorized-domain')) return 'Domain nicht freigeschaltet.';
  if (c.includes('operation-not-allowed') || c.includes('admin-restricted')) return 'Anonyme Anmeldung in Firebase aktivieren.';
  return (err && err.message) || 'Fehler.';
}

if (auth) {
  auth.onAuthStateChanged(user => {
    authUser = user;
    if (user) {
      if (user.displayName) setPlayerName(user.displayName);
      syncPlayerRecords();
      applyDevMode();
      loadUserDataFromFirebase();
    } else {
      applyDevMode();
    }
    updateAccountUI();
    // Start-Flow: einmalig entscheiden
    if (!window.__authStartHandled) {
      window.__authStartHandled = true;
      if (!user) showLoginModal();
      else if (!getPlayerName()) showNameModal();
      else syncPlayerRecords();
    }
  });
} else {
  window.__authStartHandled = true;
  if (!getPlayerName()) showNameModal();
  else syncPlayerRecords();
}

// Auto-save shop data to Firebase on purchases

};

document.getElementById('loginSubmit').addEventListener('click', doLogin);
document.getElementById('loginToggle').addEventListener('click', () => {

document.getElementById('googleBtn').addEventListener('click', loginGoogle);

document.getElementById('devBtn').addEventListener('click', e => { e.stopPropagation(); toggleDevMode(); });
document.getElementById('devGod').addEventListener('click', e => { e.stopPropagation(); toggleGodMode(); });
document.getElementById('devSpeed').addEventListener('input', e => {
  if (!developerActive()) return;
  developerSpeed = Math.max(0.25, Math.min(3, parseFloat(e.target.value) || 1));
  updateDevPanel();
});
document.getElementById('loginEmail').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
document.getElementById('loginPass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
document.getElementById('loginName').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

let AC = null;
let musicTimer = null;
let musicStep = 0;
function audio() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (AC && AC.state === 'suspended') AC.resume(); }
function tone(freq, dur, type, vol, slide) { if (!G.sound || !AC) return; const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.setValueAtTime(freq, t); if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur); o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur + .02); }
function play(type) { if (type === 'start') tone(360, .08, 'sine', .09, 520); if (type === 'pass') tone(720, .04, 'triangle', .035, 920); if (type === 'level') { tone(520, .1, 'sine', .1, 900); setTimeout(() => tone(760, .08, 'sine', .08, 1180), 80); } if (type === 'die') tone(180, .38, 'sawtooth', .18, 42); if (type === 'click') tone(420, .05, 'sine', .07, 520); if (type === 'coin') tone(880, .06, 'sine', .06, 1320); }
function currentMusic() { return MUSIC_THEMES.find(m => m.id === G.musicTheme) || MUSIC_THEMES[0]; }
function musicTone(freq, dur, type, vol) { if (!G.sound || !AC || !freq) return; const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain(); o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur); o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur + .02); }
function stopMusicLoop() { if (musicTimer) { clearInterval(musicTimer); musicTimer = null; } }
function startMusicLoop() {
  stopMusicLoop();
  if (!G.sound || !AC || G.state !== STATE.PLAY) return;
  const m = currentMusic();
  if (!m.notes.length) return;
  musicStep = 0;
  const interval = Math.max(110, (60 / m.tempo / 2) * 1000);
  musicTimer = setInterval(() => {
    if (!G.sound || G.state !== STATE.PLAY) { stopMusicLoop(); return; }
    const theme = currentMusic();
    if (!theme.notes.length) { stopMusicLoop(); return; }
    const note = theme.notes[musicStep % theme.notes.length];
    const accent = musicStep % 4 === 0;
    musicTone(note, .12, theme.wave, accent ? .045 : .028);
    if (accent) musicTone(note / 2, .18, 'triangle', .035);
    musicStep++;
  }, interval);
}
function restartMusicLoop() { if (G.state === STATE.PLAY) { audio(); startMusicLoop(); } }
function start() { reset(); }
function toggleSound() { G.sound = !G.sound; document.getElementById('soundBtn').textContent = G.sound ? 'ON' : 'OFF'; if (G.sound) { audio(); play('click'); startMusicLoop(); } else { stopMusicLoop(); } }
document.getElementById('startBtn').addEventListener('click', start);
document.getElementById('againBtn').addEventListener('click', start);
document.getElementById('homeBtn').addEventListener('click', () => { G.state = STATE.MENU; document.getElementById('over').classList.remove('show'); document.getElementById('shop').classList.remove('show'); document.getElementById('menu').classList.add('show'); document.getElementById('hint').style.display = 'block'; document.body.classList.remove('playing-cursor'); play('click'); });
document.getElementById('soundBtn').addEventListener('click', e => { e.stopPropagation(); toggleSound(); });
function typingInField() { const el = document.activeElement; return el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA'); }
addEventListener('keydown', e => {
  if (typingInField()) return;
  keys[e.code] = true;
  if (['ArrowLeft','ArrowRight','KeyA','KeyD','Space'].includes(e.code)) e.preventDefault();
  if (e.code === 'KeyM') toggleSound();
  if (e.code === 'Space' && G.state === STATE.OVER && !e.repeat) {
    keys[e.code] = false;
    start();
    return;
  }
  if (e.code === 'Enter' && G.state !== STATE.PLAY) start();
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('pointermove', e => { if (e.pointerType === 'touch' && G.state === STATE.PLAY) { mouse.isTouch = true; mouse.active = true; mouse.x = e.clientX; mouse.y = e.clientY; e.preventDefault(); } });
addEventListener('pointerdown', e => { if (e.pointerType === 'touch' && G.state === STATE.PLAY) { mouse.isTouch = true; mouse.active = true; mouse.x = e.clientX; mouse.y = e.clientY; audio(); e.preventDefault(); } });
addEventListener('mousemove', e => { if (e.pointerType !== 'touch') { const dx = Math.abs(e.clientX - mouse.x); mouse.x = e.clientX; if (dx > 2) { mouse.active = true; mouse.isTouch = false; lastInputMode = 'mouse'; } } });
addEventListener('pointerup', e => { if (e.pointerType === 'touch' && G.state === STATE.PLAY) { mouse.isTouch = true; mouse.active = true; } });
addEventListener('pointercancel', () => { mouse.active = false; mouse.isTouch = false; });
addEventListener('mouseleave', () => { mouse.active = false; mouse.isTouch = false; });
let last = performance.now();
function loop(now) { let dt = (now - last) / 1000; last = now; if (dt > .05) dt = .05; update(dt); draw(); requestAnimationFrame(loop); }
G.load(); resize(); applyDevMode(); updateHUD();
requestAnimationFrame(loop);
</script>
